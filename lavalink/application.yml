server:
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  server:
    password: "youshallnotpass"
    sources:
      youtube: true
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  allinone:
    enabled: true
    # Individual source toggles
    audiomack: true
    gaana: true
    pandora: true
    qobuz: true

    # Custom Gaana API & Proxy options
    gaanaApiUrl: "https://gaana-api-2.vercel.app/api"
    gaanaProxy: "" # Optional proxy URL (e.g. http://host:port or http://user:pass@host:port)
    pandoraProxy: "" # Optional proxy URL

    # Qobuz options (optional credentials for direct stream, formatId: 5 = MP3 320kbps)
    qobuzUserToken: ""
    qobuzFormatId: "5"
    qobuzProxy: "" # Optional proxy URL
    providers:
      - "ytmsearch:\"%ISRC%\""
      - "ytmsearch:%QUERY%"
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    com.github.allinone: INFO
  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30
